<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>1학년 과학 학습 허브</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #18283b;
      --muted: #465b73;
      --accent: #325d9c;
      --line: #d4dfed;
      --surface: #fff;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font: 1rem/1.5 "Malgun Gothic", "Apple SD Gothic Neo", system-ui, sans-serif;
      color: var(--ink);
      background: radial-gradient(ellipse at top left, #dfeafa, transparent 42rem), #f3f7fc;
      word-break: keep-all;
    }
    main {
      width: min(100% - clamp(32px, 9vw, 120px), 1312px);
      margin-inline: auto;
      padding-block: clamp(36px, 7vh, 82px) clamp(32px, 6vh, 70px);
    }
    h1, h2, p { margin: 0; }
    header { padding-bottom: clamp(22px, 4vw, 45px); }
    h1 {
      font-size: clamp(32px, 5.1vw, 68px);
      line-height: 1.18;
      letter-spacing: -.065em;
    }
    .chapter {
      display: grid;
      grid-template-columns: minmax(155px, 1fr) minmax(0, 3.8fr);
      gap: clamp(14px, 2vw, 32px);
      padding-block: clamp(17px, 2.5vw, 30px);
      border-top: 1px solid #bccde2;
    }
    h2 {
      padding-top: 5px;
      font-size: clamp(18px, 1.7vw, 25px);
      line-height: 1.35;
      letter-spacing: -.04em;
    }
    .lessons {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 10px;
      list-style: none;
      padding: 0;
      margin: 0;
    }
    .lesson {
      display: grid;
      grid-template-columns: 1fr auto;
      align-content: center;
      align-items: center;
      gap: 2px 8px;
      height: 100%;
      min-height: 84px;
      padding: 12px clamp(12px, 1.3vw, 19px);
      border: 1px solid var(--line);
      border-radius: 14px;
      background: var(--surface);
      color: var(--ink);
      text-decoration: none;
      box-shadow: 0 2px 8px #223b5a0a;
      transition: border-color .16s, background-color .16s, box-shadow .16s;
    }
    .lesson strong {
      font-size: clamp(16px, 1.35vw, 20px);
      color: var(--accent);
      letter-spacing: -.03em;
    }
    .topic { grid-column: 1 / -1; color: var(--muted); font-size: clamp(13px, 1.15vw, 16px); }
    .arrow { color: var(--accent); font-size: 20px; line-height: 1; }
    .lesson:hover {
      background: #fafdff;
      border-color: #6c8fc4;
      box-shadow: 0 4px 12px #223b5a12;
    }
    .lesson:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
    @media (max-width: 1080px) {
      .lessons { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    }
    @media (max-width: 720px) {
      .chapter { grid-template-columns: 1fr; }
      .lessons { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
    @media (prefers-reduced-motion: reduce) {
      .lesson { transition: none; }
    }
  </style>
</head>
<body>
  <main>
    <header><h1>1학년 과학 학습 허브</h1></header>
    <nav aria-label="단원별 수업 자료">
      <section class="chapter" aria-labelledby="unit-2">
        <h2 id="unit-2">생물의 구성과 다양성</h2>
        <ul class="lessons">
          <li><a class="lesson" href="./1st_section2_overall.html"><strong>2단원 총정리</strong><span class="arrow" aria-hidden="true">→</span></a></li>
        </ul>
      </section>
      <section class="chapter" aria-labelledby="unit-5">
        <h2 id="unit-5">힘의 작용</h2>
        <ul class="lessons">
          <li><a class="lesson" href="./1st_section5_1.html"><strong>5단원 (1)</strong><span class="arrow" aria-hidden="true">→</span><span class="topic">과학에서의 힘과 합력</span></a></li>
          <li><a class="lesson" href="./1st_section5_2.html"><strong>5단원 (2)</strong><span class="arrow" aria-hidden="true">→</span><span class="topic">합력과 평형, 중력</span></a></li>
          <li><a class="lesson" href="./1st_section5_3.html"><strong>5단원 (3)</strong><span class="arrow" aria-hidden="true">→</span><span class="topic">탄성력</span></a></li>
          <li><a class="lesson" href="./1st_section5_4.html"><strong>5단원 (4)</strong><span class="arrow" aria-hidden="true">→</span><span class="topic">마찰력</span></a></li>
          <li><a class="lesson" href="./1st_section5_5.html"><strong>5단원 (5)</strong><span class="arrow" aria-hidden="true">→</span><span class="topic">탄성력과 마찰력 실험</span></a></li>
          <li><a class="lesson" href="./1st_section5_6.html"><strong>5단원 (6)</strong><span class="arrow" aria-hidden="true">→</span><span class="topic">부력과 합력</span></a></li>
          <li><a class="lesson" href="./1st_section5_7.html"><strong>5단원 (7)</strong><span class="arrow" aria-hidden="true">→</span><span class="topic">여러 가지 힘 개념 정리</span></a></li>
        </ul>
      </section>
      <section class="chapter" aria-labelledby="unit-6">
        <h2 id="unit-6">기체의 성질</h2>
        <ul class="lessons">
          <li><a class="lesson" href="./1st_section6_1.html"><strong>6단원 (1)</strong><span class="arrow" aria-hidden="true">→</span><span class="topic">온도와 부피</span></a></li>
          <li><a class="lesson" href="./1st_section6_2.html"><strong>6단원 (2)</strong><span class="arrow" aria-hidden="true">→</span><span class="topic">기체의 압력</span></a></li>
        </ul>
      </section>
    </nav>
  </main>
</body>
</html>
